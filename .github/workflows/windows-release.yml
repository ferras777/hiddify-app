name: Windows release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.*'
  workflow_dispatch:
    inputs:
      ref:
        description: App source ref to build
        required: true
        default: v4.1.3
      release-tag:
        description: GitHub release tag receiving the artifacts
        required: true
        default: v4.1.3

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.5'
  CHANNEL: prod
  CORE_URL: 'https://github.com/ferras777/hiddify-core/releases/download/v4.1.2'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Fastforge
        shell: pwsh
        run: |
          make windows-install-deps
          $pubCache = Join-Path $env:LOCALAPPDATA 'Pub\Cache\bin'
          $pubCache | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare Windows
        shell: pwsh
        run: make CHANNEL=$env:CHANNEL CORE_URL=$env:CORE_URL windows-prepare

      - name: Sync Windows package version
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml |
            Select-String -Pattern '^version:\s*(\d+\.\d+\.\d+)' |
            Select-Object -First 1
          if (-not $versionLine) {
            throw 'Could not read app version from pubspec.yaml'
          }
          $version = $versionLine.Matches.Groups[1].Value
          $configPath = 'windows\packaging\msix\make_config.yaml'
          $config = Get-Content $configPath -Raw
          $config = [regex]::Replace($config, '(?m)^msix_version:.*$', "msix_version: ${version}.0")
          Set-Content $configPath $config -Encoding utf8
          Write-Host "MSIX version: ${version}.0"

      - name: Configure Windows signing
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_KEY: ${{ secrets.WINDOWS_SIGNING_KEY }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_SHA1: ${{ secrets.WINDOWS_SIGNING_SHA1 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_KEY) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_SHA1)) {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'Windows signing secrets unavailable; MSIX and code signing will be skipped.'
            exit 0
          }

          [IO.File]::WriteAllBytes(
            'windows\sign.pfx',
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_KEY)
          )
          if ((Get-Item 'windows\sign.pfx').Length -eq 0) {
            throw 'Windows signing certificate is empty'
          }

          $configPath = 'windows\packaging\msix\make_config.yaml'
          $config = Get-Content $configPath -Raw
          $config = [regex]::Replace(
            $config,
            '(?m)^certificate_password:.*$',
            "certificate_password: $($env:WINDOWS_SIGNING_PASSWORD)"
          )
          Set-Content $configPath $config -Encoding utf8
          'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows portable and setup
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          make CHANNEL=$env:CHANNEL CORE_URL=$env:CORE_URL windows-zip-release
          make CHANNEL=$env:CHANNEL CORE_URL=$env:CORE_URL windows-exe-release

      - name: Build Windows MSIX
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make CHANNEL=$env:CHANNEL CORE_URL=$env:CORE_URL windows-msix-release

      - name: Code Sign Windows binaries
        if: steps.signing.outputs.available == 'true'
        uses: hiddify/signtool-code-sign-sha256@main
        with:
          certificate: '${{ secrets.WINDOWS_SIGNING_KEY }}'
          cert-password: '${{ secrets.WINDOWS_SIGNING_PASSWORD }}'
          cert-sha1: '${{ secrets.WINDOWS_SIGNING_SHA1 }}'
          folder: dist
          timestamp-server: http://timestamp.digicert.com
          recursive: true
          description: Hiddify

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1
          $required = @(
            'Hiddify-Windows-Setup-x64.exe',
            'Hiddify-Windows-Portable-x64.zip'
          )
          if ('${{ steps.signing.outputs.available }}' -eq 'true') {
            $required += 'Hiddify-Windows-Setup-x64.msix'
          }
          foreach ($file in $required) {
            $path = Join-Path 'out' $file
            if (-not (Test-Path $path)) {
              throw "Missing Windows artifact: $file"
            }
            if ((Get-Item $path).Length -eq 0) {
              throw "Empty Windows artifact: $file"
            }
          }
          Get-ChildItem out

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-${{ inputs.release-tag || github.ref_name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag || github.ref_name }}
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
